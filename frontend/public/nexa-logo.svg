<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="nexaGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="30" y1="20" x2="90" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Dark Shield Background -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="#0A0D14" stroke="url(#nexaGrad)" stroke-width="2.5" />
  
  <!-- Neural Net Connections -->
  <g opacity="0.45" stroke="url(#nodeGrad)" stroke-width="1.2">
    <line x1="38" y1="36" x2="60" y2="24" />
    <line x1="60" y1="24" x2="82" y2="36" />
    <line x1="82" y1="36" x2="72" y2="60" />
    <line x1="72" y1="60" x2="48" y2="60" />
    <line x1="48" y1="60" x2="38" y2="36" />
    <line x1="48" y1="60" x2="38" y2="84" />
    <line x1="72" y1="60" x2="82" y2="84" />
    <line x1="38" y1="84" x2="60" y2="96" />
    <line x1="82" y1="84" x2="60" y2="96" />
    <!-- Center connecting cross lines -->
    <line x1="60" y1="24" x2="60" y2="96" stroke-dasharray="2 3" />
  </g>
  
  <!-- Neural Nodes -->
  <circle cx="38" cy="36" r="3" fill="#00F0FF" />
  <circle cx="60" cy="24" r="3.5" fill="#38BDF8" />
  <circle cx="82" cy="36" r="3" fill="#A855F7" />
  <circle cx="48" cy="60" r="2.5" fill="#00F0FF" />
  <circle cx="72" cy="60" r="2.5" fill="#EC4899" />
  <circle cx="38" cy="84" r="3" fill="#38BDF8" />
  <circle cx="82" cy="84" r="3" fill="#A855F7" />
  <circle cx="60" cy="96" r="3.5" fill="#FF007A" />

  <!-- Main Cybernetic 'N' Emblem -->
  <path d="M 36 86 L 36 34 L 50 34 L 70 66 L 70 34 L 84 34 L 84 86 L 70 86 L 50 54 L 50 86 Z" 
        fill="url(#nexaGrad)" 
        filter="url(#glow)" />
</svg>
